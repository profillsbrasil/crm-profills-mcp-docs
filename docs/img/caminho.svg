<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-labelledby="t d">
  <title id="t">Como o pedido chega ao CRM</title>
  <desc id="d">O app de IA manda o pedido com o login do vendedor ao conector, que pede ao CRM em nome dele. O CRM devolve só o que o vendedor vê na tela.</desc>
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0E4F5C" flood-opacity=".16"/></filter>
    <radialGradient id="g" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FFE3C8"/><stop offset=".45" stop-color="#F2A46B"/><stop offset="1" stop-color="#F2A46B" stop-opacity="0"/></radialGradient>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#0E4F5C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#C9733A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="960" height="330" rx="22" fill="#F2EADB"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" text-anchor="middle">
    <!-- app -->
    <g filter="url(#s)">
      <rect x="85" y="62" width="150" height="112" rx="14" fill="#0E4F5C"/>
      <rect x="85" y="62" width="150" height="24" rx="14" fill="#14606F"/>
      <rect x="85" y="76" width="150" height="10" fill="#14606F"/>
    </g>
    <circle cx="101" cy="74" r="3.5" fill="#F2A46B"/><circle cx="113" cy="74" r="3.5" fill="#B7DCC6"/><circle cx="125" cy="74" r="3.5" fill="#6FAE7A"/>
    <rect x="101" y="98" width="86" height="22" rx="11" fill="#B7DCC6"/>
    <rect x="133" y="130" width="86" height="22" rx="11" fill="#F2A46B"/>
    <rect x="101" y="160" width="52" height="6" rx="3" fill="#2E7482"/>
    <!-- conector -->
    <circle cx="480" cy="118" r="70" fill="url(#g)" opacity=".55"/>
    <g filter="url(#s)"><circle cx="480" cy="118" r="50" fill="#0E4F5C"/></g>
    <path d="M480 68a50 50 0 0 1 43 25l-43 25z" fill="#2E7482"/>
    <path d="M437 143a50 50 0 0 1 0-50l43 25z" fill="#5E9E6E" opacity=".9"/>
    <circle cx="480" cy="118" r="20" fill="#F2A46B"/><circle cx="480" cy="118" r="8" fill="#FFE3C8"/>
    <!-- crm -->
    <g filter="url(#s)">
      <rect x="742" y="54" width="118" height="84" rx="10" fill="#6FAE7A"/>
      <rect x="722" y="80" width="140" height="96" rx="12" fill="#F2A46B"/>
    </g>
    <rect x="756" y="66" width="60" height="6" rx="3" fill="#0E4F5C" opacity=".55"/>
    <circle cx="757" cy="118" r="17" fill="#0E4F5C"/><circle cx="757" cy="112" r="6" fill="#F2EADB"/><path d="M746 128a11 9 0 0 1 22 0z" fill="#F2EADB"/>
    <rect x="784" y="104" width="62" height="7" rx="3.5" fill="#FFF4E8"/><rect x="784" y="118" width="48" height="7" rx="3.5" fill="#FFF4E8"/><rect x="784" y="132" width="56" height="7" rx="3.5" fill="#FFF4E8"/>
    <rect x="738" y="154" width="108" height="8" rx="4" fill="#0E4F5C" opacity=".25"/>
    <!-- setas -->
    <path d="M252 104H412" fill="none" stroke="#0E4F5C" stroke-width="2.4" stroke-linecap="round" marker-end="url(#a)"/>
    <path d="M548 104H704" fill="none" stroke="#0E4F5C" stroke-width="2.4" stroke-linecap="round" marker-end="url(#a)"/>
    <path d="M704 136H548" fill="none" stroke="#C9733A" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="1 7" marker-end="url(#b)"/>
    <path d="M412 136H252" fill="none" stroke="#C9733A" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="1 7" marker-end="url(#b)"/>
    <g font-size="15" fill="#0E4F5C" font-weight="600">
      <text x="332" y="92">pedido + login</text>
      <text x="626" y="92">em nome do vendedor</text>
    </g>
    <g font-size="15" fill="#A85A26" font-weight="600">
      <text x="332" y="161">resposta</text>
      <text x="626" y="161">só o que ele vê na tela</text>
    </g>
    <!-- rótulos -->
    <g fill="#12323A">
      <text x="160" y="232" font-size="21" font-weight="700">App de IA</text>
      <text x="480" y="232" font-size="21" font-weight="700">Conector</text>
      <text x="792" y="232" font-size="21" font-weight="700">CRM da Profills</text>
    </g>
    <g fill="#3D5C62" font-size="15">
      <text x="160" y="258">Claude, ChatGPT ou Codex</text>
      <text x="480" y="258">mcp.profills.com/mcp</text>
      <text x="792" y="258">as mesmas regras da tela</text>
    </g>
    <line x1="60" y1="288" x2="900" y2="288" stroke="#0E4F5C" stroke-opacity=".12"/>
    <text x="480" y="312" font-size="14" fill="#3D5C62">A senha fica no CRM. O conector nunca abre o banco. Cada escrita leva o selo do app, como "via Claude".</text>
  </g>
</svg>
