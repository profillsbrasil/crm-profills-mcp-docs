    <path d="M772 92C796 92 796 60 812 60" stroke="#0E4F5C" marker-end="url(#t2)"/>
    <path d="M772 108C796 108 796 160 812 160" stroke="#0E4F5C" marker-end="url(#t2)"/>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="middle">
    <text x="175" y="88" fill="#A85A26">agente</text>
    <text x="629" y="88" fill="#A85A26">agente</text>
    <text x="453" y="88" fill="#0E4F5C">aprova</text>
    <text x="330" y="170" fill="#0E4F5C" text-anchor="start">rejeita</text>
