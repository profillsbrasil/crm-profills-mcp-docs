    <path d="M40 304H76" stroke="#C9733A" stroke-width="2.4" stroke-linecap="round"/>
    <text x="88" y="309">o agente (enviar_proposta) ou a tela</text>
    <path d="M400 304H436" stroke="#0E4F5C" stroke-width="2.4" stroke-linecap="round"/>
    <text x="448" y="309">só na tela: o admin ou o admin_tp aprova e rejeita</text>
